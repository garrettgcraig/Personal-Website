		<!-- Trail Log index loader -->
			<script>
				(function () {
					var list = document.getElementById('trail-list');
					if (!list) return;

					function escapeHtml(s) {
						return String(s == null ? '' : s)
							.replace(/&/g, '&amp;')
							.replace(/</g, '&lt;')
							.replace(/>/g, '&gt;')
							.replace(/"/g, '&quot;');
					}

					function formatDate(iso) {
						// Expect "YYYY-MM-DD"; render as "August 15, 2025".
						var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso || '');
						if (!m) return escapeHtml(iso);
						var months = ['January', 'February', 'March', 'April', 'May', 'June',
							'July', 'August', 'September', 'October', 'November', 'December'];
						var month = months[parseInt(m[2], 10) - 1] || '';
						return month + ' ' + parseInt(m[3], 10) + ', ' + m[1];
					}

					function showEmpty() {
						list.innerHTML = '<p class="trail-empty">No entries yet — check back soon!</p>';
					}

					function render(data) {
						var entries = (data && data.entries) || [];
						if (!entries.length) { showEmpty(); return; }

						var html = '';
						entries.forEach(function (e) {
							var meta = [formatDate(e.date), escapeHtml(e.location)]
								.filter(Boolean).join(' &middot; ');

							var tags = '';
							if (e.tags && e.tags.length) {
								tags = '<div class="trail-card-tags">' +
									e.tags.map(function (t) {
										return '<span>' + escapeHtml(t) + '</span>';
									}).join('') + '</div>';
							}

							var cover = e.cover
								? '<img class="card-image" src="' + escapeHtml(e.cover) +
									'" alt="' + escapeHtml(e.title) + '" loading="lazy" />'
								: '';

							html += '<a class="trail-card" href="' + escapeHtml(e.url) + '">' +
								cover +
								'<div class="card-body">' +
									'<h3>' + escapeHtml(e.title) + '</h3>' +
									'<p class="trail-card-meta">' + meta + '</p>' +
									(e.summary ? '<p>' + escapeHtml(e.summary) + '</p>' : '') +
									tags +
								'</div>' +
							'</a>';
						});
						list.innerHTML = html;
					}

					fetch('data/trail-log.json', { cache: 'no-store' })
						.then(function (res) {
							if (!res.ok) throw new Error('status ' + res.status);
							return res.json();
						})
						.then(render)
						.catch(function () { showEmpty(); });
				})();
			</script>
