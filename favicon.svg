<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Top half clip: G will be redrawn on top here -->
    <clipPath id="top-half">
      <rect x="0" y="0" width="100" height="50"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="100" height="100" rx="14" fill="#1c2040"/>

  <!-- Step 1: G (back layer) -->
  <g fill="none" stroke="#f0e6d0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 62,36 A 24,24 0 1,0 62,64"/>
    <line x1="62" y1="50" x2="47" y2="50"/>
  </g>

  <!-- Step 2: C (middle layer — C now appears in front of G everywhere) -->
  <path d="M 82,38 A 20,20 0 1,0 82,62"
        fill="none" stroke="#f0e6d0" stroke-width="5.5" stroke-linecap="round"/>

  <!-- Step 3: G in top half on top of C (creates interlocking effect) -->
  <!-- 3a: erase C where G overlaps it (top half only) -->
  <g clip-path="url(#top-half)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 62,36 A 24,24 0 1,0 62,64" stroke="#1c2040" stroke-width="13"/>
    <line x1="62" y1="50" x2="47" y2="50" stroke="#1c2040" stroke-width="13"/>
  </g>
  <!-- 3b: redraw G in top half (colored) -->
  <g clip-path="url(#top-half)" fill="none" stroke="#f0e6d0" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 62,36 A 24,24 0 1,0 62,64"/>
    <line x1="62" y1="50" x2="47" y2="50"/>
  </g>
</svg>
