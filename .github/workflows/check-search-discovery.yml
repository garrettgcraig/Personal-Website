name: Check search discovery
on:
  push:
    paths: ['**.html', 'trail-log/entries/**', 'data/trail-log.json', 'scripts/build_search_discovery.py', 'scripts/build_trail_log.py', 'sitemap.xml', 'robots.txt', 'llms.txt', 'trail-*.md', '_headers', '.github/workflows/check-search-discovery.yml']
  pull_request:
    paths: ['**.html', 'trail-log/entries/**', 'data/trail-log.json', 'scripts/build_search_discovery.py', 'scripts/build_trail_log.py', 'sitemap.xml', 'robots.txt', 'llms.txt', 'trail-*.md', '_headers', '.github/workflows/check-search-discovery.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_search_discovery.py --check
