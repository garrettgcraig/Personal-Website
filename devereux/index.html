<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Devereux Slough Breach Outlook - Garrett G. Craig</title>
	<meta name="description" content="Live status of the Devereux Slough mouth at Coal Oil Point Reserve, Goleta, CA, and the chance the sand berm breaches over the next 10 days." />
	<link rel="canonical" href="https://garrettgcraig.com/devereux/" />
	<meta property="og:type" content="website" />
	<meta property="og:site_name" content="Garrett G. Craig" />
	<meta property="og:title" content="Devereux Slough Breach Outlook" />
	<meta property="og:description" content="Is the Devereux Slough mouth open, and how likely is a breach in the next 10 days? Live rain, slough level, tides, and waves." />
	<meta property="og:url" content="https://garrettgcraig.com/devereux/" />
	<meta property="og:image" content="https://garrettgcraig.com/images/og-card.jpg" />
	<link rel="stylesheet" href="../assets/css/brand.css" />
	<link rel="icon" type="image/svg+xml" href="../favicon.svg" />
	<script src="../assets/js/darkmode.js"></script>
	<style>
		* { box-sizing: border-box; }
		body {
			margin: 0; background: var(--color-bg); color: var(--color-text);
			font-family: var(--font-body); font-size: var(--text-body); line-height: var(--leading-body);
		}
		body.dark-mode { background: var(--color-bg); }
		a { color: var(--color-link); }
		.wrap { max-width: 1040px; margin: 0 auto; padding: 0 var(--space-4); }

		header.top { border-bottom: 1px solid var(--color-border); }
		header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 56px; }
		.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-ui); font-weight: 600; color: var(--color-text); text-decoration: none; }
		.brand svg { width: 28px; height: 28px; }
		.dm { background: none; border: 1px solid var(--color-border); border-radius: var(--radius-pill); color: var(--color-muted); font: 500 0.8rem var(--font-ui); padding: 4px 12px; cursor: pointer; }

		.eyebrow { font: 600 var(--text-eyebrow) var(--font-ui); letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--color-accent); margin: 0; }
		h1, h2, h3 { font-family: var(--font-display); line-height: var(--leading-tight); margin: 0; }
		h1 { font-size: clamp(2.2rem, 4vw + 1rem, 3.6rem); font-weight: 700; letter-spacing: -0.01em; }
		h2 { font-size: 1.5rem; font-weight: 600; margin-bottom: var(--space-2); }
		h3 { font-size: 1.05rem; font-weight: 600; }
		.muted { color: var(--color-muted); }
		.small { font-size: var(--text-small); }
		.mono { font-family: var(--font-mono); }

		.hero { padding: var(--space-12) 0 var(--space-8); display: grid; gap: var(--space-8); grid-template-columns: 1.1fr 1fr; align-items: start; }
		.hero .lede { margin: var(--space-3) 0 0; max-width: 46ch; }
		.state-dot { display: inline-block; width: 0.55em; height: 0.55em; border-radius: 50%; margin-right: 0.3em; vertical-align: 0.12em; }

		.outlook { background: var(--color-raised); border: 1px solid var(--color-border); border-radius: var(--radius-lg); padding: var(--space-6); box-shadow: var(--shadow-soft); }
		.level { display: inline-block; font: 700 0.8rem var(--font-ui); letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 12px; border-radius: var(--radius-pill); }
		.level.low { background: var(--gc-sage-pale); color: #3c4a20; }
		.level.watch { background: var(--gc-ochre); color: var(--gc-ink); }
		.level.likely { background: var(--gc-clay); color: var(--gc-paper); }
		.level.na { background: var(--color-surface); color: var(--color-muted); }
		.big { font: 600 clamp(2.4rem, 5vw, 3.4rem)/1 var(--font-mono); margin: var(--space-3) 0 var(--space-1); }
		.outlook p { margin: var(--space-2) 0 0; }

		.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--space-4); margin-bottom: var(--space-12); }
		.tile { border-top: 3px solid var(--color-highlight); padding-top: var(--space-3); }
		.tile .v { font: 500 1.6rem/1.2 var(--font-mono); }
		.tile .l { font: 500 0.85rem var(--font-ui); color: var(--color-muted); margin-top: 2px; }

		section.block { margin-bottom: var(--space-12); }
		.chart-card { background: var(--color-raised); border: 1px solid var(--color-border); border-radius: var(--radius-md); padding: var(--space-4) var(--space-4) var(--space-2); }
		.chart-card + .chart-card { margin-top: var(--space-4); }
		.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4); }
		svg.chart { width: 100%; height: auto; display: block; overflow: visible; }
		svg.chart text { font-family: var(--font-ui); font-size: 11px; fill: var(--color-muted); }
		svg.chart .axis { stroke: var(--color-border); }
		svg.chart .grid { stroke: var(--color-border); stroke-dasharray: 2 3; }
		.range-btns { display: flex; gap: 6px; margin-bottom: var(--space-2); }
		.range-btns button { font: 500 0.8rem var(--font-ui); padding: 4px 12px; border-radius: var(--radius-pill); border: 1px solid var(--color-border); background: none; color: var(--color-muted); cursor: pointer; }
		.range-btns button[aria-pressed="true"] { background: var(--color-accent); border-color: var(--color-accent); color: var(--color-on-accent); }
		.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font: 500 0.8rem var(--font-ui); color: var(--color-muted); margin: 2px 0 var(--space-2); }
		.legend i { display: inline-block; width: 12px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
		.legend i.line { height: 3px; vertical-align: 2px; }

		table.days { width: 100%; border-collapse: collapse; font: 0.85rem var(--font-ui); margin-top: var(--space-2); }
		table.days th, table.days td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
		table.days th:first-child, table.days td:first-child { text-align: left; }
		table.days td { font-family: var(--font-mono); font-size: 0.8rem; }
		table.days tr.today td { background: var(--color-surface); }
		.table-scroll { overflow-x: auto; }

		ul.plain { list-style: none; padding: 0; margin: 0; }
		ul.plain li { padding: 6px 0; border-bottom: 1px solid var(--color-border); font: 0.9rem var(--font-ui); display: flex; justify-content: space-between; gap: 12px; }
		.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: var(--space-2); }
		.chip { font: 500 0.75rem var(--font-ui); padding: 2px 10px; border-radius: var(--radius-pill); background: var(--color-surface); color: var(--color-muted); }
		.chip.bad { background: var(--gc-clay); color: var(--gc-paper); }
		.warn { border-left: 3px solid var(--color-highlight); padding: var(--space-2) var(--space-4); background: var(--color-surface); border-radius: var(--radius-sm); font: 0.9rem var(--font-ui); margin-top: var(--space-4); }
		.prose { max-width: var(--measure); }
		.prose p { margin: 0 0 var(--space-4); }
		footer { border-top: 1px solid var(--color-border); padding: var(--space-8) 0; font: 0.85rem var(--font-ui); color: var(--color-muted); }
		.loading { padding: var(--space-16) 0; text-align: center; font-family: var(--font-ui); color: var(--color-muted); }

		@media (max-width: 820px) {
			.hero { grid-template-columns: 1fr; padding-top: var(--space-8); }
			.tiles { grid-template-columns: repeat(2, 1fr); }
			.grid2 { grid-template-columns: 1fr; }
		}
	</style>
</head>
<body>
	<header class="top">
		<div class="wrap">
			<a class="brand" href="/" aria-label="Garrett G. Craig, home">
				<svg viewBox="0 0 100 100" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1B2530"/><path d="M71 33 A26 26 0 1 0 74 58" fill="none" stroke="#F6F6F2" stroke-width="8" stroke-linecap="round"/><path d="M44 58 L54 45 L61 52 L66 47 L76 58" fill="none" stroke="#D3A43B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></svg>
				Garrett G. Craig
			</a>
			<button class="dm" id="dark-mode-toggle" type="button" aria-label="Switch to dark mode">Theme</button>
		</div>
	</header>

	<main class="wrap" id="app">
		<div class="loading" id="loading">Checking the slough...</div>
	</main>

	<footer>
		<div class="wrap">
			Model and page by <a href="/">Garrett G. Craig</a>. Data: CCBER (UC Santa Barbara), NOAA, CoCoRaHS, Iowa Environmental Mesonet, Open-Meteo, NDBC.
			Not an official forecast; check conditions in person before planning around the mouth.
		</div>
	</footer>

	<script type="module" src="app.js"></script>
</body>
</html>
