		<!-- Wilderness Tracker App -->
		<script>
		(function () {
			"use strict";

			var PAL_UNVISITED = "#5a8a5e";
			var PAL_VISITED   = "#d4a017";

			var geojsonData = null;
			var geojsonLayer = null;
			var featureIndex = {};
			var featureData  = {};
			var allNames     = [];
			var visited      = new Set();
			var sortCol      = "name";
			var sortAsc      = true;

			var STORAGE_KEY = "wilderness_visited_wids";

			function saveVisited() {
				try { localStorage.setItem(STORAGE_KEY, JSON.stringify(Array.from(visited))); } catch (_) {}
			}
			function loadVisited() {
				try {
					var raw = localStorage.getItem(STORAGE_KEY);
					if (raw) {
						var arr = JSON.parse(raw);
						if (Array.isArray(arr)) visited = new Set(arr.map(String));
					}
				} catch (_) {}
			}

			function fmtNum(n) {
				if (n == null || isNaN(n)) return "—";
				return Number(n).toLocaleString("en-US");
			}

			function updateStats() {
				var total = Object.keys(featureData).length || 843;
				var count = visited.size;
				var pct = total > 0 ? (100 * count / total).toFixed(1) : 0;
				var acres = 0;
				visited.forEach(function (wid) {
					if (featureData[wid]) acres += (featureData[wid].acres || 0);
				});
				document.getElementById("stat-count").textContent = count;
				document.getElementById("stat-pct").textContent = pct + "%";
				document.getElementById("stat-acres").textContent = fmtNum(acres);
				document.getElementById("progress-bar").style.width = pct + "%";
			}

			function renderTable() {
				var tbody = document.getElementById("visited-tbody");
				if (visited.size === 0) {
					tbody.innerHTML = '<tr><td colspan="3" class="empty-msg">Click areas on the map to start tracking.</td></tr>';
					return;
				}
				var rows = [];
				visited.forEach(function (wid) {
					var d = featureData[wid];
					if (d) rows.push(d);
				});
				rows.sort(function (a, b) {
					var va = a[sortCol], vb = b[sortCol];
					if (sortCol === "acres") {
						va = va || 0; vb = vb || 0;
						return sortAsc ? va - vb : vb - va;
					}
					va = (va || "").toLowerCase();
					vb = (vb || "").toLowerCase();
					if (va < vb) return sortAsc ? -1 : 1;
					if (va > vb) return sortAsc ? 1 : -1;
					return 0;
				});
				var html = "";
				rows.forEach(function (d) {
					html += '<tr data-wid="' + d.wid + '">'
						+ "<td>" + d.name + "</td>"
						+ "<td>" + (d.state || "") + "</td>"
						+ "<td>" + fmtNum(d.acres) + "</td>"
						+ "</tr>";
				});
				tbody.innerHTML = html;
			}

			document.querySelectorAll(".visited-table th[data-sort]").forEach(function (th) {
				th.addEventListener("click", function () {
					var col = th.getAttribute("data-sort");
					if (sortCol === col) { sortAsc = !sortAsc; } else { sortCol = col; sortAsc = true; }
					document.querySelectorAll(".visited-table th .sort-arrow").forEach(function (s) { s.textContent = ""; });
					th.querySelector(".sort-arrow").textContent = sortAsc ? " ▲" : " ▼";
					renderTable();
				});
			});

			document.getElementById("visited-tbody").addEventListener("click", function (e) {
				var row = e.target.closest("tr[data-wid]");
				if (!row) return;
				var wid = row.getAttribute("data-wid");
				if (featureIndex[wid]) {
					map.flyToBounds(featureIndex[wid].getBounds(), { maxZoom: 11, duration: 1 });
				}
			});

			function styleFeature(layer, isVisited) {
				layer.setStyle({
					fillColor:   isVisited ? PAL_VISITED : PAL_UNVISITED,
					fillOpacity: isVisited ? 0.6 : 0.3,
					color:       isVisited ? PAL_VISITED : PAL_UNVISITED,
					weight:      isVisited ? 1.8 : 1,
					opacity:     isVisited ? 0.9 : 0.6
				});
			}

			function toggleVisit(wid) {
				wid = String(wid);
				if (visited.has(wid)) { visited.delete(wid); } else { visited.add(wid); }
				if (featureIndex[wid]) styleFeature(featureIndex[wid], visited.has(wid));
				saveVisited();
				updateStats();
				renderTable();
			}

			var map = L.map("map", { zoomSnap: 0.5 }).setView([39.8, -98.5], 4);

			var baseLayers = {
				"Light":     L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", { attribution: '&copy; <a href="https://carto.com/">CARTO</a>', maxZoom: 19 }),
				"Topo":      L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", { attribution: "Esri", maxZoom: 18 }),
				"Satellite": L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", { attribution: "Esri", maxZoom: 18 })
			};
			baseLayers["Light"].addTo(map);
			L.control.layers(baseLayers, null, { collapsed: true }).addTo(map);

			loadVisited();

			fetch("data/wilderness_areas.geojson")
				.then(function (r) { return r.json(); })
				.then(function (data) {
					geojsonData = data;
					geojsonLayer = L.geoJSON(data, {
						style: function (feature) {
							var wid = String(feature.properties.wid);
							var isV = visited.has(wid);
							return {
								fillColor:   isV ? PAL_VISITED : PAL_UNVISITED,
								fillOpacity: isV ? 0.6 : 0.3,
								color:       isV ? PAL_VISITED : PAL_UNVISITED,
								weight:      isV ? 1.8 : 1,
								opacity:     isV ? 0.9 : 0.6
							};
						},
						onEachFeature: function (feature, layer) {
							var p = feature.properties;
							var wid = String(p.wid);
							featureIndex[wid] = layer;
							featureData[wid] = {
								wid: wid, name: p.name || "Unknown", state: p.state || "",
								agency: p.agency || "", acres: Number(p.acres) || 0, designated: p.designated || ""
							};
							var tip = '<div class="wild-tooltip"><strong>' + p.name + '</strong><br>'
								+ (p.state || '') + ' · ' + (p.agency || '') + '<br>'
								+ fmtNum(p.acres) + ' acres'
								+ (p.designated ? '<br>Designated ' + p.designated : '') + '</div>';
							layer.bindTooltip(tip, { sticky: true, direction: "top", offset: [0, -8] });
							layer.on("mouseover", function () {
								layer.setStyle({ weight: 3, color: "#fff", fillOpacity: 0.65 });
								layer.bringToFront();
							});
							layer.on("mouseout", function () { styleFeature(layer, visited.has(wid)); });
							layer.on("click", function () { toggleVisit(wid); });
						}
					}).addTo(map);

					allNames = Object.values(featureData)
						.map(function (d) { return { name: d.name, state: d.state, wid: d.wid }; })
						.sort(function (a, b) { return a.name.localeCompare(b.name); });

					updateStats();
					renderTable();

					// Invalidate map size after layout settles
					setTimeout(function () { map.invalidateSize(); }, 200);
				})
				.catch(function (err) {
					console.error("Failed to load wilderness data:", err);
					document.getElementById("map").innerHTML = '<p style="padding:2rem;color:#c0392b;">Failed to load wilderness boundary data.</p>';
				});

			// Autocomplete
			var searchInput = document.getElementById("search-input");
			var acList      = document.getElementById("ac-list");
			var acIdx       = -1;

			searchInput.addEventListener("input", function () {
				var q = this.value.trim().toLowerCase();
				acIdx = -1;
				if (q.length < 2) { acList.style.display = "none"; return; }
				var matches = allNames.filter(function (d) { return d.name.toLowerCase().indexOf(q) !== -1; }).slice(0, 30);
				if (matches.length === 0) { acList.style.display = "none"; return; }
				acList.innerHTML = matches.map(function (d, i) {
					return '<div class="ac-item" data-wid="' + d.wid + '" data-idx="' + i + '">'
						+ d.name + '<span class="ac-state">' + d.state + '</span></div>';
				}).join("");
				acList.style.display = "block";
			});

			searchInput.addEventListener("keydown", function (e) {
				var items = acList.querySelectorAll(".ac-item");
				if (!items.length) return;
				if (e.key === "ArrowDown") { e.preventDefault(); acIdx = Math.min(acIdx + 1, items.length - 1); }
				else if (e.key === "ArrowUp") { e.preventDefault(); acIdx = Math.max(acIdx - 1, 0); }
				else if (e.key === "Enter") { e.preventDefault(); if (acIdx >= 0 && items[acIdx]) items[acIdx].click(); return; }
				else if (e.key === "Escape") { acList.style.display = "none"; return; }
				else return;
				items.forEach(function (el, i) { el.classList.toggle("active", i === acIdx); });
			});

			acList.addEventListener("click", function (e) {
				var item = e.target.closest(".ac-item");
				if (!item) return;
				var wid = item.getAttribute("data-wid");
				searchInput.value = "";
				acList.style.display = "none";
				if (!visited.has(wid)) toggleVisit(wid);
				if (featureIndex[wid]) map.flyToBounds(featureIndex[wid].getBounds(), { maxZoom: 11, duration: 1 });
			});

			document.addEventListener("click", function (e) {
				if (!e.target.closest(".search-wrap")) acList.style.display = "none";
			});

			// Export
			document.getElementById("btn-export").addEventListener("click", function (e) {
				e.preventDefault();
				if (visited.size === 0) { alert("No areas to export."); return; }
				var lines = ["name,state,agency,acres,designated,wid"];
				visited.forEach(function (wid) {
					var d = featureData[wid];
					if (d) lines.push(['"' + d.name.replace(/"/g, '""') + '"', '"' + (d.state||"") + '"', '"' + (d.agency||"") + '"', d.acres||"", '"' + (d.designated||"") + '"', d.wid].join(","));
				});
				var blob = new Blob([lines.join("\n")], { type: "text/csv" });
				var a = document.createElement("a");
				a.href = URL.createObjectURL(blob);
				a.download = "wilderness_visits_" + new Date().toISOString().slice(0, 10) + ".csv";
				a.click();
				URL.revokeObjectURL(a.href);
			});

			// Import
			var importInput = document.getElementById("import-input");
			document.getElementById("btn-import").addEventListener("click", function (e) { e.preventDefault(); importInput.click(); });
			importInput.addEventListener("change", function () {
				var file = this.files[0];
				if (!file) return;
				var reader = new FileReader();
				reader.onload = function (ev) {
					var lines = ev.target.result.split(/\r?\n/).filter(function (l) { return l.trim(); });
					if (lines.length < 2) { alert("CSV appears empty."); return; }
					var cols = lines[0].toLowerCase().split(",");
					var widIdx = -1, nameIdx = -1;
					cols.forEach(function (c, i) { c = c.replace(/"/g,"").trim(); if (c==="wid") widIdx=i; if (c==="name") nameIdx=i; });
					var imported = 0;
					for (var i = 1; i < lines.length; i++) {
						var vals = lines[i].match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
						if (!vals) continue;
						vals = vals.map(function (v) { return v.replace(/^"|"$/g,"").trim(); });
						var wid = null;
						if (widIdx >= 0 && vals[widIdx]) wid = String(vals[widIdx]);
						else if (nameIdx >= 0 && vals[nameIdx]) {
							var nm = vals[nameIdx].toLowerCase();
							for (var w in featureData) { if (featureData[w].name.toLowerCase() === nm) { wid = w; break; } }
						}
						if (wid && featureData[wid] && !visited.has(wid)) {
							visited.add(wid);
							if (featureIndex[wid]) styleFeature(featureIndex[wid], true);
							imported++;
						}
					}
					saveVisited(); updateStats(); renderTable();
					alert("Imported " + imported + " wilderness area(s).");
				};
				reader.readAsText(file);
				this.value = "";
			});

			// Clear
			document.getElementById("btn-clear").addEventListener("click", function (e) {
				e.preventDefault();
				if (visited.size === 0) return;
				if (!confirm("Clear all " + visited.size + " visited areas?")) return;
				visited.forEach(function (wid) { if (featureIndex[wid]) styleFeature(featureIndex[wid], false); });
				visited.clear();
				saveVisited(); updateStats(); renderTable();
			});

		})();
		</script>

	</body>
</html>
