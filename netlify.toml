# Function settings and the secret-scan exception live here. Build and publish settings stay in the Netlify UI.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The Web Push "subject" is the page's public URL, which appears in ordinary site files.
# It is not a secret, so keep Netlify's secret scan from failing deploys on it.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "DEVEREUX_VAPID_SUBJECT"
# Apple's app-link file must list the Apple team ID, which is public by design. The same ID
# is set as WEATHERKIT_TEAM_ID, so skip that one file rather than the key everywhere.
  SECRETS_SCAN_OMIT_PATHS = ".well-known/apple-app-site-association"
